# Render Blueprint for the Django API. The React frontend deploys to Vercel.
services:
  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://weather-aware-truck-routing.vercel.app
      - key: TOMTOM_API_KEY
        sync: false
